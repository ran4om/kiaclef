name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
      - name: Build and test
        run: ./gradlew --console=plain build
      - name: Hash artifacts
        working-directory: ./build/libs
        run: sha256sum *.jar > hashes.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kiaclef
          path: build/libs
