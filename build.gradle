plugins {
    id "net.fabricmc.fabric-loom" version "1.15.5"
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

def baritoneJar = file("libs/baritone-unoptimized-fabric-1.19.0.jar")

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation files(baritoneJar)

    include(implementation("com.fasterxml.jackson.core:jackson-databind:2.20.0"))
    include(implementation("com.fasterxml.jackson.core:jackson-core:2.20.0"))
    include(implementation("com.fasterxml.jackson.core:jackson-annotations:2.20"))
    include(implementation("org.apache.commons:commons-lang3:3.20.0"))

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.java_release as int
    options.compilerArgs += ["-Xmaxerrs", "10000"]
}

tasks.named("test") {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filteringCharset = "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
    from("LICENSE-BARITONE") {
        rename { "${it}_baritone" }
    }
    from(baritoneJar) {
        into("META-INF/jars")
    }
}

// Opt-in integration mod, excluded from the distributable AltoClef jar.
sourceSets {
    runtimeTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    runtimeTestImplementation.extendsFrom implementation
    runtimeTestRuntimeOnly.extendsFrom runtimeOnly
}
loom {
    mods {
        altoclef { sourceSet sourceSets.main }
        altoclef_runtime_test { sourceSet sourceSets.runtimeTest }
    }
    runs {
        runtimeTestClient {
            client()
            name 'AltoClef 26.2 Runtime Acceptance'
            source sourceSets.runtimeTest
            runDir 'run/runtimeTest'
            vmArg '-Daltoclef.runtimeTest=true'
        }
    }
}
